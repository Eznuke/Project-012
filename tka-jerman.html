<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulasi TKA Bahasa Jerman</title>
<style>
  /* ===== Token desain ===== */
  :root {
    --bg: #f5f2ea;
    --ink: #151515;
    --muted: #6b675d;
    --line: #d9d4c6;
    --card: #fffdf8;
    --accent: #e8420e;
    --ok: #1d7a46;
    --bad: #b3261e;
    --warn: #b7791f;
    --gap: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ===== Grid 12 kolom ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: var(--gap);
    max-width: 980px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .c12 { grid-column: span 12; }
  .c8  { grid-column: span 8; }
  .c4  { grid-column: span 4; }

  /* ===== Header ===== */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 2px solid var(--ink);
    padding: 12px 0;
  }
  header .grid { align-items: center; }
  .judul { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .judul small { display: block; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .timer { text-align: right; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .timer.warn { color: var(--accent); }

  /* ===== Progress & navigator ===== */
  main { padding-bottom: 48px; }
  .progres-info { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-top: 20px; gap: 12px; }
  .link-btn { background: none; border: none; border-bottom: 2px solid var(--ink); color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0 0 1px; }
  .bar { height: 6px; background: var(--line); margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s; }
  .navgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); }
  .navgrid button { aspect-ratio: 1.3; border: 2px solid var(--line); background: var(--bg); font-weight: 700; cursor: pointer; }
  .navgrid button.jawab { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .navgrid button.ragu { background: var(--warn); color: #fff; border-color: var(--warn); }
  .navgrid button.kini { outline: 3px solid var(--accent); outline-offset: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 2px solid var(--line); background: var(--bg); vertical-align: -1px; }
  .legend .l-jawab::before { background: var(--ink); border-color: var(--ink); }
  .legend .l-ragu::before { background: var(--warn); border-color: var(--warn); }

  /* ===== Soal ===== */
  .no-soal { font-size: clamp(72px, 22vw, 168px); font-weight: 900; line-height: .9; letter-spacing: -.04em; margin: 20px 0 8px; }
  .no-soal span { color: var(--accent); }
  .tipe { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border: 2px solid var(--ink); padding: 2px 8px; margin-bottom: 12px; }
  .stimulus { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--ink); padding: 14px 16px; font-size: 15px; margin-bottom: 20px; }
  .stimulus table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  .stimulus th, .stimulus td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  .stimulus th { background: var(--bg); }
  .pertanyaan { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .petunjuk { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

  /* ===== Opsi jawaban ===== */
  .opsi { display: grid; gap: 10px; }
  .opsi button { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .opsi button:hover { border-color: var(--ink); }
  .opsi button .huruf { font-weight: 900; min-width: 20px; }
  .opsi button.terpilih { border-color: var(--ink); background: var(--ink); color: var(--card); }
  .opsi.kotak button .huruf { border: 2px solid currentColor; min-width: 24px; height: 24px; text-align: center; line-height: 20px; font-size: 13px; }

  /* ===== Pilihan ganda kompleks kategori ===== */
  .kat-row { background: var(--card); border: 2px solid var(--line); padding: 12px 14px; margin-bottom: 10px; }
  .kat-row p { margin-bottom: 10px; font-size: 15px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { padding: 10px; font-weight: 700; border: 2px solid var(--line); background: var(--bg); cursor: pointer; }
  .seg button.terpilih { background: var(--ink); color: var(--card); border-color: var(--ink); }

  /* ===== Navigasi bawah ===== */
  .ragu-btn { margin-top: 18px; width: 100%; padding: 10px; font-weight: 700; border: 2px dashed var(--warn); background: transparent; color: var(--warn); cursor: pointer; }
  .ragu-btn.aktif { background: var(--warn); color: #fff; border-style: solid; }
  .nav { display: flex; gap: var(--gap); margin-top: 14px; }
  .btn { flex: 1; padding: 14px; font-weight: 700; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .btn:hover:not(:disabled) { background: var(--ink); color: var(--card); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn.utama { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.utama:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); }

  /* ===== Intro ===== */
  .intro-judul { font-size: clamp(40px, 11vw, 88px); font-weight: 900; line-height: .95; letter-spacing: -.03em; margin: 28px 0 16px; }
  .intro-judul span { color: var(--accent); }
  .info-tabel { width: 100%; border-collapse: collapse; margin: 12px 0 20px; background: var(--card); }
  .info-tabel td { border: 1px solid var(--line); padding: 10px 12px; font-size: 14px; }
  .info-tabel td:first-child { font-weight: 700; width: 38%; }
  .catatan { font-size: 13px; color: var(--muted); margin-top: 16px; }
  .catatan a { color: var(--ink); }
  .daftar { margin: 8px 0 0 18px; font-size: 14px; }
  .daftar li { margin-bottom: 4px; }

  /* ===== Hasil ===== */
  .skor { font-size: clamp(96px, 30vw, 220px); font-weight: 900; line-height: .9; letter-spacing: -.05em; margin-top: 28px; }
  .ringkas { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 12px 0 28px; font-weight: 700; }
  .ringkas .ok { color: var(--ok); } .ringkas .bad { color: var(--bad); } .ringkas .sb { color: var(--warn); }
  .ulasan { background: var(--card); border: 1px solid var(--line); padding: 16px; margin-bottom: var(--gap); border-left: 6px solid var(--line); }
  .ulasan.benar { border-left-color: var(--ok); }
  .ulasan.sebagian { border-left-color: var(--warn); }
  .ulasan.salah { border-left-color: var(--bad); }
  .ulasan h3 { font-size: 15px; margin-bottom: 6px; }
  .ulasan .jwb { font-size: 14px; margin: 8px 0; }
  .ulasan .jwb b.ok { color: var(--ok); } .ulasan .jwb b.bad { color: var(--bad); }
  .ulasan ul { list-style: none; font-size: 14px; margin: 6px 0; }
  .ulasan li { padding: 4px 0; border-bottom: 1px dotted var(--line); }
  .ulasan li .t-ok { color: var(--ok); font-weight: 700; } .ulasan li .t-bad { color: var(--bad); font-weight: 700; }
  .ulasan .bahas { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }

  /* ===== Layar lebar ===== */
  @media (min-width: 720px) {
    .c8-md { grid-column: 3 / span 8; }
    .judul { font-size: 16px; }
    .navgrid { grid-template-columns: repeat(10, 1fr); }
  }
  @media (max-width: 719px) {
    .c8, .c4 { grid-column: span 12; }
    .judul { margin-bottom: 4px; }
    .timer { text-align: left; font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <div class="grid">
    <div class="c8 judul">Simulasi TKA Bahasa Jerman<small>Mapel Pilihan · SMA</small></div>
    <div class="c4 timer" id="timer">60:00</div>
  </div>
</header>

<main class="grid">
  <div class="c12 c8-md" id="app"></div>
</main>

<script>
/* =====================================================================
   SIMULASI TKA BAHASA JERMAN (SMA, MAPEL PILIHAN)
   Mengikuti format TKA: 25 soal, 60 menit, tiga bentuk soal:
     "pg"       = pilihan ganda sederhana (1 jawaban benar)  -> kunci: index
     "mcma"     = pilihan ganda kompleks (lebih dari 1 benar) -> kunci: array index
     "kategori" = pilihan ganda kompleks kategori (Benar/Salah per pernyataan)
                  -> kunci: array boolean
   Semua soal di bawah adalah soal latihan ORISINAL, bukan soal resmi TKA.
   ===================================================================== */
const DURASI_DETIK = 60 * 60;
const STORAGE_KEY = "tka-jerman-v1";
const HURUF = ["A", "B", "C", "D", "E"];
const LABEL_TIPE = { pg: "Pilihan Ganda", mcma: "Pilihan Ganda Kompleks", kategori: "Pilihan Ganda Kompleks (Kategori)" };
const PETUNJUK = {
  pg: "Pilih satu jawaban yang paling tepat.",
  mcma: "Pilih semua jawaban yang benar (lebih dari satu).",
  kategori: "Tentukan apakah setiap pernyataan Benar atau Salah."
};

/* ===== Bahasa Jerman (A2-B1) ===== */
const TXT_1 = "AUSHANG – Schulcafeteria\nAb Montag, dem 10. Juni, hat die Cafeteria neue Öffnungszeiten: Sie ist von 7.30 bis 14.00 Uhr geöffnet. In der großen Pause gibt es warme Gerichte, zum Beispiel Nudeln oder Suppe. Ein Mittagessen kostet 3,50 Euro. Wer eine Mehrfachkarte für fünf Essen kauft, bezahlt nur 15 Euro.";

const TXT_2 = "Hallo Lena,\nich schreibe dir, weil ich am Samstag nicht zum Training kommen kann. Ich muss zum Zahnarzt, und der Termin ist um 10 Uhr. Außerdem habe ich gestern meine Sporttasche im Bus vergessen. Kannst du dem Trainer bitte Bescheid sagen? Am Sonntag habe ich Zeit, wenn du ins Kino gehen möchtest.\nViele Grüße\nMia";

const TXT_3 = "Fahrplan Köln → Bonn (Samstag)";
const TBL_3 = { kepala: ["Zug", "Abfahrt Köln", "Ankunft Bonn", "Gleis"], baris: [["RB 26", "7.15", "7.45", "3"], ["RE 5", "8.00", "8.25", "5"], ["RB 27", "12.15", "12.45", "3"], ["RE 7", "17.30", "17.55", "6"]] };

const TXT_4 = "ZIMMER ZU VERMIETEN\nWir sind eine WG mit drei Studenten und suchen einen vierten Mitbewohner. Das Zimmer ist 14 m² groß und hat einen Balkon. Die Miete beträgt 350 Euro im Monat, inklusive Nebenkosten und Internet. Küche und Bad teilen wir. Haustiere sind leider nicht erlaubt. Bitte rufen Sie uns abends an.";

const TXT_5 = "Am Wochenende bin ich mit meiner Familie nach Hamburg gefahren. Wir haben im Hafen ein Schiff besichtigt und danach Fisch gegessen. Mein Bruder wollte unbedingt das Museum sehen, aber es war geschlossen. Deshalb sind wir in einen Park gegangen. Am Abend waren wir müde, aber glücklich.";

const TXT_6 = "Immer mehr Schüler fahren mit dem Fahrrad zur Schule. In einer Umfrage in München haben 40 Prozent der Schüler gesagt, dass sie das Rad nehmen, weil es schnell und billig ist. Andere fahren lieber mit dem Bus, wenn es regnet. Die Stadt will mehr Radwege bauen, damit der Schulweg sicherer wird. Einige Eltern finden das gut, andere haben Angst, dass der Verkehr trotzdem zu gefährlich bleibt.";

const RICHTIG_FALSCH = "Tentukan apakah setiap pernyataan berikut sesuai dengan teks (Benar) atau tidak sesuai (Salah).";

const SOAL = [
  /* ---------- Aushang Cafeteria (1-3) ---------- */
  { tipe: "pg", stimulus: TXT_1,
    pertanyaan: "Was ist der Zweck dieses Aushangs?",
    opsi: ["Er informiert die Schüler über neue Öffnungszeiten und Preise der Cafeteria.", "Er sucht neue Mitarbeiter für die Cafeteria.", "Er lädt die Schüler zu einem Schulfest ein.", "Er verbietet das Essen im Klassenzimmer.", "Er kündigt einen Ausflug an."], kunci: 0,
    pembahasan: "Pengumuman memuat jam buka baru, menu hangat, harga makan siang, dan kartu berlangganan. Tujuannya memberi informasi tentang jam buka dan harga kantin (A). Pilihan lain tidak disebut." },

  { tipe: "pg", stimulus: TXT_1,
    pertanyaan: "Wie viel spart man mit der Mehrfachkarte im Vergleich zu fünf einzelnen Essen?",
    opsi: ["1,50 Euro", "2,00 Euro", "2,50 Euro", "3,50 Euro", "5,00 Euro"], kunci: 2,
    pembahasan: "Lima makan satuan: 5 × 3,50 = 17,50 Euro. Kartu berlangganan: 15 Euro. Selisih 17,50 − 15 = 2,50 Euro (C)." },

  { tipe: "mcma", stimulus: TXT_1,
    pertanyaan: "Pilih semua pernyataan yang sesuai dengan pengumuman.",
    opsi: ["Die Cafeteria öffnet um 7.30 Uhr.", "Warme Gerichte gibt es nach dem Unterricht.", "Ein einzelnes Mittagessen kostet 3,50 Euro.", "Die Cafeteria schließt um 14.00 Uhr.", "Die Mehrfachkarte gilt für zehn Essen."], kunci: [0, 2, 3],
    pembahasan: "A, C, dan D tertulis langsung. B salah: makanan hangat tersedia pada jam istirahat besar (in der großen Pause). E salah: kartu berlaku untuk lima makan (fünf Essen)." },

  /* ---------- E-Mail (4-6) ---------- */
  { tipe: "pg", stimulus: TXT_2,
    pertanyaan: "Warum kann Mia am Samstag nicht zum Training kommen?",
    opsi: ["Sie ist krank.", "Sie muss zum Zahnarzt.", "Sie hat keine Lust.", "Sie besucht ihre Oma.", "Sie arbeitet im Kino."], kunci: 1,
    pembahasan: "Mia menulis \"Ich muss zum Zahnarzt\". Alasan lain tidak disebut dalam surel." },

  { tipe: "pg", stimulus: TXT_2,
    pertanyaan: "Das Wort \"Termin\" bedeutet in diesem Text ...",
    opsi: ["ein Geschenk für einen Freund", "ein Zimmer im Krankenhaus", "ein langer Brief", "eine feste Zeit für einen Besuch beim Arzt", "eine Fahrkarte für den Bus"], kunci: 3,
    pembahasan: "\"Der Termin ist um 10 Uhr\" setelah \"Zahnarzt\" berarti janji temu dengan waktu yang sudah ditentukan." },

  { tipe: "kategori", stimulus: TXT_2,
    pertanyaan: RICHTIG_FALSCH,
    pernyataan: ["Mia hat ihre Sporttasche im Bus vergessen.", "Mia kommt am Samstag zum Training.", "Mia schlägt vor, am Sonntag ins Kino zu gehen.", "Der Termin beim Zahnarzt ist am Nachmittag."], kunci: [true, false, true, false],
    pembahasan: "(1) Benar: \"meine Sporttasche im Bus vergessen\". (2) Salah: ia tidak bisa datang. (3) Benar: hari Minggu ia punya waktu jika Lena mau ke bioskop. (4) Salah: janji temu pukul 10 Uhr, yaitu pagi." },

  /* ---------- Fahrplan (7-8) ---------- */
  { tipe: "pg", stimulus: TXT_3, tabel: TBL_3,
    pertanyaan: "Anna muss um 9 Uhr in Bonn sein. Welchen Zug nimmt sie, wenn sie so spät wie möglich fahren will?",
    opsi: ["RB 26", "RB 27", "RE 7", "Keinen der Züge", "RE 5"], kunci: 4,
    pembahasan: "Kereta yang tiba sebelum pukul 9.00 adalah RB 26 (7.45) dan RE 5 (8.25). Yang paling akhir adalah RE 5. RB 27 dan RE 7 tiba terlalu siang." },

  { tipe: "mcma", stimulus: TXT_3, tabel: TBL_3,
    pertanyaan: "Pilih semua pernyataan yang sesuai dengan jadwal.",
    opsi: ["Der RB 27 braucht 25 Minuten.", "Der RE 5 fährt von Gleis 5 ab.", "Alle Züge fahren vom selben Gleis ab.", "Der letzte Zug fährt um 17.30 Uhr ab.", "Der RE 7 ist schneller als der RB 26."], kunci: [1, 3, 4],
    pembahasan: "RE 5 di Gleis 5 (B benar). Kereta terakhir berangkat 17.30 (D benar). RE 7: 17.30-17.55 = 25 menit, RB 26: 7.15-7.45 = 30 menit, jadi RE 7 lebih cepat (E benar). A salah: RB 27 butuh 30 menit. C salah: jalurnya 3, 5, 3, 6." },

  /* ---------- Anzeige WG (9-11) ---------- */
  { tipe: "pg", stimulus: TXT_4,
    pertanyaan: "Was ist in der Miete enthalten?",
    opsi: ["Nur die Miete für das Zimmer", "Strom, aber kein Internet", "Nebenkosten und Internet", "Essen und Getränke", "Die Möbel und eine Putzfrau"], kunci: 2,
    pembahasan: "Teks: \"350 Euro im Monat, inklusive Nebenkosten und Internet\"." },

  { tipe: "pg", stimulus: TXT_4,
    pertanyaan: "Tom hat einen Hund und interessiert sich für das Zimmer. Was sagt die Anzeige dazu?",
    opsi: ["Haustiere sind nicht erlaubt.", "Hunde sind im Zimmer willkommen.", "Man muss für Haustiere extra bezahlen.", "Nur Katzen sind verboten.", "Der Hund darf nur im Bad schlafen."], kunci: 0,
    pembahasan: "Iklan menyatakan \"Haustiere sind leider nicht erlaubt\", jadi hewan peliharaan termasuk anjing tidak diizinkan." },

  { tipe: "kategori", stimulus: TXT_4,
    pertanyaan: RICHTIG_FALSCH,
    pernyataan: ["In der WG wohnen schon vier Personen.", "Das Zimmer hat einen Balkon.", "Die Miete beträgt 450 Euro im Monat.", "Die Bewohner teilen Küche und Bad."], kunci: [false, true, false, true],
    pembahasan: "(1) Salah: sudah tiga mahasiswa, dicari yang keempat. (2) Benar. (3) Salah: sewanya 350 Euro. (4) Benar: \"Küche und Bad teilen wir\"." },

  /* ---------- Wochenende in Hamburg (12-13) ---------- */
  { tipe: "pg", stimulus: TXT_5,
    pertanyaan: "Warum sind sie in einen Park gegangen?",
    opsi: ["Weil es geregnet hat.", "Weil sie müde waren.", "Weil sie Hunger hatten.", "Weil das Museum geschlossen war.", "Weil der Bruder Fußball spielen wollte."], kunci: 3,
    pembahasan: "Teks: \"Mein Bruder wollte unbedingt das Museum sehen, aber es war geschlossen. Deshalb sind wir in einen Park gegangen.\" Kata \"deshalb\" menunjukkan akibat." },

  { tipe: "kategori", stimulus: TXT_5,
    pertanyaan: "Tentukan apakah setiap pernyataan tentang tata bahasa dalam teks berikut Benar atau Salah.",
    pernyataan: ["\"bin ... gefahren\" ist Perfekt mit dem Hilfsverb \"sein\".", "\"wollte\" ist die Präteritum-Form von \"wollen\".", "\"Wir haben ... Fisch gegessen\" ist Perfekt mit dem Hilfsverb \"sein\".", "\"waren\" ist eine Form von \"haben\"."], kunci: [true, true, false, false],
    pembahasan: "(1) Benar: fahren (gerak) memakai sein. (2) Benar: wollte = Präteritum wollen. (3) Salah: essen memakai haben (haben ... gegessen). (4) Salah: waren adalah bentuk Präteritum dari sein." },

  /* ---------- Fahrrad (14-16) ---------- */
  { tipe: "pg", stimulus: TXT_6,
    pertanyaan: "Worum geht es in dem Text?",
    opsi: ["Um die Preise für Busfahrkarten", "Um das Fahrrad als Schulweg und die Pläne der Stadt für mehr Sicherheit", "Um ein neues Fahrradgeschäft in München", "Um Verkehrsregeln für Autofahrer", "Um den Sportunterricht an Schulen"], kunci: 1,
    pembahasan: "Teks membahas siswa yang naik sepeda ke sekolah, alasannya, serta rencana kota membangun jalur sepeda agar lebih aman (B)." },

  { tipe: "pg", stimulus: TXT_6,
    pertanyaan: "Warum nehmen viele Schüler das Rad?",
    opsi: ["Weil es immer warm ist.", "Weil der Bus verboten ist.", "Weil die Schule Fahrräder schenkt.", "Weil die Eltern es verlangen.", "Weil es schnell und billig ist."], kunci: 4,
    pembahasan: "Teks: \"weil es schnell und billig ist\"." },

  { tipe: "mcma", stimulus: TXT_6,
    pertanyaan: "Pilih semua pernyataan yang sesuai dengan teks.",
    opsi: ["40 Prozent der befragten Schüler nehmen das Rad.", "Bei Regen fahren manche Schüler lieber mit dem Bus.", "Die Stadt will weniger Radwege bauen.", "Alle Eltern finden die Pläne gut.", "Der Schulweg soll sicherer werden."], kunci: [0, 1, 4],
    pembahasan: "A, B, dan E sesuai teks. C salah: kota ingin membangun lebih banyak (mehr) jalur sepeda. D salah: hanya sebagian orang tua setuju, yang lain takut lalu lintas tetap berbahaya." },

  /* ---------- Grammatik (17-25) ---------- */
  { tipe: "pg", stimulus: "Eine Schülerin erzählt: \"Gestern ___ ich nicht ins Kino gehen, weil ich krank war.\"",
    pertanyaan: "Welche Form passt in die Lücke?",
    opsi: ["konnte", "kann", "können", "gekonnt", "könnt"], kunci: 0,
    pembahasan: "Kalimat bercerita tentang kemarin dan memakai \"war\" (Präteritum), jadi modalverb juga Präteritum: ich konnte. \"kann\" adalah Präsens, \"können\" bentuk infinitif/wir, \"könnt\" bentuk ihr." },

  { tipe: "pg", stimulus: "Im Klassenzimmer: \"Der Lehrer gibt ___ Schülerin ___ Buch.\"",
    pertanyaan: "Welche Kombination ist richtig?",
    opsi: ["die / ein", "der / ein", "der / einem", "die / einen", "dem / ein"], kunci: 1,
    pembahasan: "Geben memakai objek tak langsung (Dativ) dan objek langsung (Akkusativ). Die Schülerin (feminin) menjadi Dativ: der Schülerin. Das Buch (netral) Akkusativ tetap: ein Buch." },

  { tipe: "pg", stimulus: "Eine Schülerin erklärt, warum sie nicht zur Schule kommt: \"Ich bleibe heute zu Hause, ___.\"",
    pertanyaan: "Welcher Nebensatz ist richtig?",
    opsi: ["weil bin ich krank", "weil ich bin krank", "weil krank ich bin", "weil ich krank bin", "weil ich krank sein"], kunci: 3,
    pembahasan: "Dalam anak kalimat dengan weil, kata kerja yang terkonjugasi berada di akhir kalimat: \"weil ich krank bin\"." },

  { tipe: "mcma", stimulus: "Hier sind fünf Sätze aus einer Übung zum Perfekt.",
    pertanyaan: "Pilih semua kalimat yang benar secara tata bahasa.",
    opsi: ["Er hat nach Berlin gefahren.", "Ich habe gestern einen Brief geschrieben.", "Wir sind früh aufgestanden.", "Sie ist ein Buch gelesen.", "Ihr habt Pizza gegessen."], kunci: [1, 2, 4],
    pembahasan: "Schreiben dan essen memakai haben; aufstehen (perubahan keadaan) memakai sein. A salah: fahren ke suatu tempat memakai sein (ist gefahren). D salah: lesen dengan objek langsung memakai haben (hat gelesen)." },

  { tipe: "mcma", stimulus: "Hier sind fünf Sätze aus einer Übung zu Nebensätzen.",
    pertanyaan: "Pilih semua kalimat yang benar secara tata bahasa.",
    opsi: ["Ich glaube, dass er heute kommt.", "Wenn es regnet, ich bleibe zu Hause.", "Sie sagt, dass sie hat keine Zeit.", "Wenn es regnet, bleibe ich zu Hause.", "Ich weiß, dass du gern Fußball spielst."], kunci: [0, 3, 4],
    pembahasan: "Setelah dass, kata kerja di akhir (kommt, spielst). Jika anak kalimat dengan wenn di awal, kalimat induk dimulai dengan kata kerja: \"bleibe ich\". B salah karena urutan kata. C salah karena \"hat\" harus di akhir: \"dass sie keine Zeit hat\"." },

  { tipe: "mcma", stimulus: "Hier sind fünf Sätze aus einer Übung zu Präpositionen.",
    pertanyaan: "Pilih semua kalimat yang benar secara tata bahasa.",
    opsi: ["Ich fahre mit dem Bus zur Schule.", "Wir gehen nach die Schule.", "Sie wohnt seit einem Jahr in Berlin.", "Er kommt aus der Türkei.", "Ich warte auf dem Bus."], kunci: [0, 2, 3],
    pembahasan: "mit, seit, dan aus selalu diikuti Dativ: mit dem Bus, seit einem Jahr, aus der Türkei (die Türkei, Dativ feminin: der). B salah: nach tidak dipakai dengan die Schule dan harus Dativ/zur. E salah: warten auf memakai Akkusativ, yaitu \"auf den Bus\"." },

  { tipe: "mcma", stimulus: "Hier sind fünf Sätze aus einer Übung zu Modalverben.",
    pertanyaan: "Pilih semua kalimat yang benar secara tata bahasa.",
    opsi: ["Ich muss heute früh aufstehen.", "Wir wollen morgen ins Kino zu gehen.", "Er kann gut Klavier spielen.", "Du darf hier nicht parken.", "Sie soll mehr Wasser trinken."], kunci: [0, 2, 4],
    pembahasan: "Modalverb diikuti infinitif tanpa zu, dan di akhir kalimat. B salah karena ada \"zu\". D salah: bentuk untuk du adalah \"darfst\". A, C, E benar." },

  { tipe: "kategori", stimulus: "Eine Lehrerin prüft Sätze zu Artikeln und Kasus.",
    pertanyaan: "Tentukan apakah setiap kalimat berikut benar secara tata bahasa (Benar) atau mengandung kesalahan (Salah).",
    pernyataan: ["Ich sehe den Mann.", "Ich helfe den Mann.", "Das Buch liegt auf den Tisch.", "Sie schenkt ihrer Mutter Blumen."], kunci: [true, false, false, true],
    pembahasan: "(1) Benar: sehen + Akkusativ (den Mann). (2) Salah: helfen memakai Dativ, yaitu \"dem Mann\". (3) Salah: posisi (liegen, tanpa gerakan) memakai Dativ, yaitu \"auf dem Tisch\". (4) Benar: schenken + Dativ (ihrer Mutter)." },

  { tipe: "kategori", stimulus: "Ein Lehrer prüft Sätze im Perfekt.",
    pertanyaan: "Tentukan apakah setiap kalimat berikut benar secara tata bahasa (Benar) atau mengandung kesalahan (Salah).",
    pernyataan: ["Ich habe gestern zu Hause geblieben.", "Gestern bin ich ins Kino gegangen.", "Er hat gestern lange geschlafen.", "Sie ist ihren Freund angerufen."], kunci: [false, true, true, false],
    pembahasan: "(1) Salah: bleiben memakai sein, yaitu \"bin geblieben\". (2) Benar: gehen memakai sein. (3) Benar: schlafen memakai haben. (4) Salah: anrufen memakai haben dan objek jenis Akkusativ: \"hat ihren Freund angerufen\"." }
];

/* ===== State ===== */
let state = null;          // { jawaban, ragu, posisi, akhir, selesai, karenaWaktu }
let layar = "intro";       // intro | ujian | hasil
let tick = null;
let panelNav = false;
const app = document.getElementById("app");
const timerEl = document.getElementById("timer");

/* ===== Penyimpanan lokal (agar progres aman saat halaman dimuat ulang) ===== */
function simpan() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({
    jawaban: state.jawaban, ragu: state.ragu, posisi: state.posisi, akhir: state.akhir
  })); } catch (e) {}
}
function hapusSimpanan() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
function muat() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (raw && Array.isArray(raw.jawaban) && raw.jawaban.length === SOAL.length) return raw;
  } catch (e) {}
  return null;
}

/* ===== Util ===== */
function el(tag, attrs = {}, ...anak) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  anak.forEach(a => e.append(a));
  return e;
}
function terjawab(i) {
  const j = state.jawaban[i], tipe = SOAL[i].tipe;
  if (tipe === "pg") return j !== null;
  if (tipe === "mcma") return Array.isArray(j) && j.length > 0;
  return Array.isArray(j) && j.every(v => v !== null);
}
function jumlahTerjawab() { return SOAL.reduce((n, _, i) => n + (terjawab(i) ? 1 : 0), 0); }
function ke(i) { state.posisi = i; panelNav = false; simpan(); render(); window.scrollTo(0, 0); }

/* ===== Timer (berbasis waktu akhir, jadi akurat walau tab di-background) ===== */
function tampilTimer() {
  const s = Math.max(Math.round((state.akhir - Date.now()) / 1000), 0);
  timerEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  timerEl.classList.toggle("warn", s <= 300);
  return s;
}
function jalankanTimer() {
  clearInterval(tick);
  tick = setInterval(() => { if (tampilTimer() <= 0) selesai(true); }, 1000);
  tampilTimer();
}

/* ===== Alur ujian ===== */
function mulai() {
  state = {
    jawaban: SOAL.map(s => s.tipe === "mcma" ? [] : s.tipe === "kategori" ? s.pernyataan.map(() => null) : null),
    ragu: SOAL.map(() => false),
    posisi: 0,
    akhir: Date.now() + DURASI_DETIK * 1000,
    selesai: false
  };
  simpan();
  layar = "ujian";
  jalankanTimer();
  render();
  window.scrollTo(0, 0);
}
function selesai(karenaWaktu) {
  clearInterval(tick);
  state.selesai = true;
  state.karenaWaktu = karenaWaktu;
  layar = "hasil";
  hapusSimpanan();
  render();
  window.scrollTo(0, 0);
}
function ulangi() {
  state = null; layar = "intro";
  timerEl.textContent = "60:00"; timerEl.classList.remove("warn");
  render(); window.scrollTo(0, 0);
}

/* ===== Penilaian =====
   pg       : 1 poin jika benar
   mcma     : 1 poin jika himpunan jawaban persis sama dengan kunci
   kategori : poin = proporsi pernyataan yang dijawab dengan benar */
function skorSoal(i) {
  const s = SOAL[i], j = state.jawaban[i];
  if (s.tipe === "pg") return j === s.kunci ? 1 : 0;
  if (s.tipe === "mcma") return Array.isArray(j) && j.length === s.kunci.length && s.kunci.every(k => j.includes(k)) ? 1 : 0;
  return Array.isArray(j) ? j.filter((v, n) => v === s.kunci[n]).length / s.kunci.length : 0;
}

/* ===== Render ===== */
function render() {
  if (layar === "intro") return renderIntro();
  if (layar === "hasil") return renderHasil();
  renderSoal();
}

function renderIntro() {
  app.innerHTML = "";
  const adaLama = muat();
  app.append(
    el("h1", { class: "intro-judul" }, "Bahasa", el("br"), "Jerman", el("span", {}, ".")),
    el("table", { class: "info-tabel" },
      ...[["Jumlah soal", "25 butir"], ["Waktu", "60 menit"],
          ["Bentuk soal", "Pilihan ganda, pilihan ganda kompleks, pilihan ganda kompleks kategori"],
          ["Cakupan", "Pemahaman teks pendek, Wortschatz, Perfekt, Modalverben, Kasus, Nebensätze"]]
        .map(r => el("tr", {}, el("td", {}, r[0]), el("td", {}, r[1])))),
    el("p", { class: "petunjuk" }, "Petunjuk pengerjaan:"),
    el("ul", { class: "daftar" },
      el("li", {}, "Pilihan ganda: pilih satu jawaban yang paling tepat."),
      el("li", {}, "Pilihan ganda kompleks: pilih semua jawaban yang benar."),
      el("li", {}, "Kategori: tentukan Benar atau Salah untuk setiap pernyataan."),
      el("li", {}, "Tandai soal yang diragukan dengan tombol \"Ragu-ragu\", lalu buka Daftar Soal untuk kembali."),
      el("li", {}, "Ujian otomatis dikumpulkan saat waktu habis.")),
    el("div", { class: "nav" }, el("button", { class: "btn utama", onclick: mulai }, "Mulai Ujian")),
    el("p", { class: "catatan" },
      "Soal pada simulasi ini adalah soal latihan orisinal yang mengikuti format TKA, bukan soal resmi. Untuk simulasi resmi, buka ",
      el("a", { href: "https://pusmendik.kemdikbud.go.id/tka/simulasi_tka", target: "_blank", rel: "noopener" }, "pusmendik.kemdikbud.go.id/tka/simulasi_tka"), ".")
  );
  // Lanjutkan sesi yang tersimpan (misalnya halaman tidak sengaja dimuat ulang)
  if (adaLama) {
    state = { ...adaLama, selesai: false };
    layar = "ujian";
    if (state.akhir <= Date.now()) { selesai(true); return; }
    jalankanTimer();
    render();
  }
}

function renderSoal() {
  const i = state.posisi, s = SOAL[i];
  const terakhir = i === SOAL.length - 1;
  app.innerHTML = "";

  // progress + tombol daftar soal
  const info = el("div", { class: "progres-info" },
    el("span", {}, `Soal ${i + 1} dari ${SOAL.length} · ${jumlahTerjawab()} terjawab`),
    el("button", { class: "link-btn", type: "button", onclick: () => { panelNav = !panelNav; render(); } }, panelNav ? "Tutup daftar" : "Daftar soal"));
  const bar = el("div", { class: "bar" }, el("i", {}));
  bar.firstChild.style.width = ((i + 1) / SOAL.length * 100) + "%";
  app.append(info, bar);

  // navigator nomor soal
  if (panelNav) {
    const g = el("div", { class: "navgrid" });
    SOAL.forEach((_, n) => {
      const kelas = [state.ragu[n] ? "ragu" : terjawab(n) ? "jawab" : "", n === i ? "kini" : ""].join(" ").trim();
      g.append(el("button", { type: "button", class: kelas, onclick: () => ke(n) }, String(n + 1)));
    });
    app.append(g, el("div", { class: "legend" },
      el("span", { class: "l-jawab" }, "Terjawab"), el("span", { class: "l-ragu" }, "Ragu-ragu"), el("span", {}, "Belum dijawab")));
  }

  // nomor besar (satu keputusan visual utama per layar)
  app.append(el("div", { class: "no-soal" }, String(i + 1).padStart(2, "0"), el("span", {}, ".")));
  app.append(el("span", { class: "tipe" }, LABEL_TIPE[s.tipe]));

  // stimulus
  const stim = el("div", { class: "stimulus" }, el("p", {}, s.stimulus));
  if (s.tabel) {
    const tb = el("table");
    tb.append(el("tr", {}, ...s.tabel.kepala.map(h => el("th", {}, h))));
    s.tabel.baris.forEach(r => tb.append(el("tr", {}, ...r.map(c => el("td", {}, c)))));
    stim.append(tb);
  }
  app.append(stim, el("p", { class: "pertanyaan" }, s.pertanyaan), el("p", { class: "petunjuk" }, PETUNJUK[s.tipe]));

  // area jawaban sesuai bentuk soal
  if (s.tipe === "pg") {
    const w = el("div", { class: "opsi" });
    s.opsi.forEach((t, n) => w.append(el("button", {
      type: "button", class: state.jawaban[i] === n ? "terpilih" : "",
      onclick: () => { state.jawaban[i] = n; simpan(); render(); }
    }, el("span", { class: "huruf" }, HURUF[n]), el("span", {}, t))));
    app.append(w);
  } else if (s.tipe === "mcma") {
    const w = el("div", { class: "opsi kotak" });
    s.opsi.forEach((t, n) => w.append(el("button", {
      type: "button", class: state.jawaban[i].includes(n) ? "terpilih" : "",
      onclick: () => {
        const a = state.jawaban[i];
        state.jawaban[i] = a.includes(n) ? a.filter(x => x !== n) : [...a, n].sort();
        simpan(); render();
      }
    }, el("span", { class: "huruf" }, HURUF[n]), el("span", {}, t))));
    app.append(w);
  } else {
    s.pernyataan.forEach((t, n) => {
      const v = state.jawaban[i][n];
      const set = (val) => { state.jawaban[i][n] = val; simpan(); render(); };
      app.append(el("div", { class: "kat-row" },
        el("p", {}, `${n + 1}. ${t}`),
        el("div", { class: "seg" },
          el("button", { type: "button", class: v === true ? "terpilih" : "", onclick: () => set(true) }, "Benar"),
          el("button", { type: "button", class: v === false ? "terpilih" : "", onclick: () => set(false) }, "Salah"))));
    });
  }

  // ragu-ragu + navigasi
  app.append(
    el("button", { type: "button", class: "ragu-btn" + (state.ragu[i] ? " aktif" : ""),
      onclick: () => { state.ragu[i] = !state.ragu[i]; simpan(); render(); } },
      state.ragu[i] ? "Ditandai ragu-ragu (ketuk untuk batal)" : "Tandai ragu-ragu"),
    el("div", { class: "nav" },
      el("button", { type: "button", class: "btn", disabled: i === 0, onclick: () => ke(i - 1) }, "Sebelumnya"),
      el("button", { type: "button", class: "btn utama", onclick: () => {
        if (!terakhir) return ke(i + 1);
        const kosong = SOAL.length - jumlahTerjawab();
        const ragu = state.ragu.filter(Boolean).length;
        let pesan = "";
        if (kosong) pesan += `Masih ada ${kosong} soal belum dijawab lengkap. `;
        if (ragu) pesan += `Ada ${ragu} soal ditandai ragu-ragu. `;
        if (pesan && !confirm(pesan + "Tetap selesai dan lihat hasil?")) return;
        selesai(false);
      } }, terakhir ? "Selesai & Lihat Hasil" : "Selanjutnya"))
  );
}

/* ===== Hasil ===== */
function renderHasil() {
  const total = SOAL.length;
  const poin = SOAL.reduce((n, _, i) => n + skorSoal(i), 0);
  const skor = Math.round(poin / total * 100);
  const penuh = SOAL.filter((_, i) => skorSoal(i) === 1).length;
  const sebagian = SOAL.filter((_, i) => { const k = skorSoal(i); return k > 0 && k < 1; }).length;
  const salah = total - penuh - sebagian;

  app.innerHTML = "";
  app.append(
    el("p", { class: "progres-info" }, state.karenaWaktu ? "Waktu habis. Jawabanmu dikumpulkan otomatis." : "Ujian selesai."),
    el("div", { class: "skor" }, String(skor)),
    el("div", { class: "ringkas" },
      el("span", { class: "ok" }, `Benar penuh: ${penuh}`),
      el("span", { class: "sb" }, `Sebagian: ${sebagian}`),
      el("span", { class: "bad" }, `Salah/kosong: ${salah}`),
      el("span", {}, `Poin: ${poin.toFixed(2).replace(/\.?0+$/, "")} / ${total}`))
  );

  SOAL.forEach((s, i) => {
    const sk = skorSoal(i), j = state.jawaban[i];
    const status = sk === 1 ? "benar" : sk > 0 ? "sebagian" : "salah";
    const kartu = el("div", { class: "ulasan " + status },
      el("h3", {}, `Soal ${i + 1} · ${LABEL_TIPE[s.tipe]} · ${sk === 1 ? "Benar" : sk > 0 ? "Sebagian benar" : "Salah"}`),
      el("p", {}, s.pertanyaan));

    if (s.tipe === "pg") {
      kartu.append(
        el("p", { class: "jwb" }, el("b", { class: sk ? "ok" : "bad" }, "Jawabanmu: "), j === null ? "Tidak dijawab" : `${HURUF[j]}. ${s.opsi[j]}`),
        el("p", { class: "jwb" }, el("b", { class: "ok" }, "Jawaban benar: "), `${HURUF[s.kunci]}. ${s.opsi[s.kunci]}`));
    } else if (s.tipe === "mcma") {
      const dipilih = j.length ? j.map(n => HURUF[n]).join(", ") : "Tidak dijawab";
      kartu.append(
        el("p", { class: "jwb" }, el("b", { class: sk ? "ok" : "bad" }, "Jawabanmu: "), dipilih),
        el("p", { class: "jwb" }, el("b", { class: "ok" }, "Jawaban benar: "), s.kunci.map(n => HURUF[n]).join(", ")));
    } else {
      const ul = el("ul");
      s.pernyataan.forEach((t, n) => {
        const u = j[n], benar = u === s.kunci[n];
        const nama = v => v === null ? "kosong" : v ? "Benar" : "Salah";
        ul.append(el("li", {}, `${n + 1}. ${t} `,
          el("span", { class: benar ? "t-ok" : "t-bad" }, `Kamu: ${nama(u)}`),
          ` · kunci: ${nama(s.kunci[n])}`));
      });
      kartu.append(ul);
    }
    kartu.append(el("p", { class: "bahas" }, s.pembahasan));
    app.append(kartu);
  });

  app.append(el("div", { class: "nav" }, el("button", { type: "button", class: "btn utama", onclick: ulangi }, "Ulangi Ujian")));
}

render();
</script>
